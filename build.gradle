plugins {
	// 26.x is unobfuscated: non-remapping Loom, no mappings, no mod* dependency configurations.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom already provides Fabric, Mojang and Maven Central. Mod Menu lives here.
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// We patch Mod Menu, so it has to be on the compile classpath. Nothing is bundled:
	// the user installs Mod Menu themselves and our mixins apply to it at runtime.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Tests run the real map surgery against the real Mod Menu Mod interface.
	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testImplementation "com.google.guava:guava:${project.guava_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
		// Only the Mod interface is needed here; do not drag Mod Menu's own dependencies in.
		transitive = false
	}
}

tasks.named('test') {
	useJUnitPlatform()

	testLogging {
		events "passed", "skipped", "failed"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
