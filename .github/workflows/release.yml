name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must match mod_version in gradle.properties)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag $TAG / mod_version $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match mod_version '$VERSION' (expected 'v$VERSION')"
            exit 1
          fi

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Check the jar before publishing
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/modmenufix-*.jar | grep -v sources | head -n 1)
          echo "jar: $JAR"

          # the jar must carry the version from fabric.mod.json, not the placeholder
          VERSION=$(unzip -p "$JAR" fabric.mod.json | grep -o '"version": *"[^"]*"' | head -n 1 | cut -d'"' -f4)
          echo "jar version: $VERSION"
          if [ "$VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Jar version '$VERSION' does not match mod_version '${{ steps.version.outputs.version }}'"
            exit 1
          fi

          for entry in fabric.mod.json modmenufix.mixins.json assets/modmenufix/icon.png; do
            unzip -l "$JAR" | grep -F " $entry" > /dev/null \
              || { echo "::error::Jar is missing $entry"; exit 1; }
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          JAR=$(ls build/libs/modmenufix-*.jar | grep -v sources | head -n 1)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="--target $GITHUB_SHA"
          else
            TARGET=""
          fi

          gh release create "$TAG" "$JAR" \
            --title "Mod Menu Fix ${TAG#v} for Minecraft 26.3" \
            --generate-notes \
            $TARGET

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: modmenufix-release-jar
          path: build/libs/modmenufix-*.jar
          if-no-files-found: error
